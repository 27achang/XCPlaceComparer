<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" type="text/css" />
    <title>XC Place Comparer</title>
</head>
<body>
    <div id="buttons_div">
        <button id="SHC_runner_button" onclick="onSHCRunnerPassing()">SHC</button>
        <button id="SI_runner_button" onclick="onSIRunnerPassing()">SI</button>
        <button id="other_runner_button" onclick="onOtherRunnerPassing()">Other</button>
    </div>
    <div id="footer">
        <div>
            <span id="SHC_team_place_display" class="label">SHC</span>
            <span id="SHC_athelete_place_display"></span>
        </div>
        <div>
            <span id="SI_team_place_display" class="label">SI</span>
            <span id="SI_athelete_place_display"></span>
        </div>
        <div>
            <span id="runners_past_label" class="label">Runners Past</span>
            <span id="runners_past_display"></span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
