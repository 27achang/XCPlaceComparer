<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" type="text/css" />
    <title>XC Place Comparer</title>
</head>
<body>
    <div id="buttons_div">
        <button class="SHC" onclick="onRunnerPassing('SHC')">SHC</button>
        <button class="SI" onclick="onRunnerPassing('SI')">SI</button>
        <button id="other_runner_button" onclick="onOtherRunnerPassing()">Other</button>
    </div>
    <div id="footer">
        <div class="SHC">
            <span class="label">SHC</span>
            <span></span>
        </div>
        <div>
            <span class="label">SI</span>
            <span></span>
        </div>
        <div id="runners_past_footer">
            <span id="runners_past_label" class="label">Runners Past</span>
            <span id="runners_past_display"></span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
